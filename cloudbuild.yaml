# Google Cloud Build Pipeline for AegisOps AI
steps:
  # Step 1: Run automated unit and security test suites
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        python -m unittest discover -s backend/tests

  # Step 2: Build production container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aegisops-platform:$COMMIT_SHA', '.']

  # Step 3: Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aegisops-platform:$COMMIT_SHA']

  # Step 4: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aegisops-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aegisops-platform:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/aegisops-platform:$COMMIT_SHA'
